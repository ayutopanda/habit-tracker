firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const firestore = firebase.firestore();
firestore.enablePersistence({ synchronizeTabs: true }).catch(e => console.warn(e.code));

const storage = {
  cache: {}, uid: null, ready: false,
  async loadAll() {
    if (!this.uid) { this.cache = {}; this.ready = true; return; }
    try {
      const doc = await firestore.collection('users').doc(this.uid).get();
      this.cache = doc.exists ? (doc.data() || {}) : {};
    } catch (e) { console.error(e); this.cache = {}; }
    this.ready = true;
  },
  async get(key) {
    const v = this.cache[key];
    if (v === undefined || v === null) return null;
    return { key, value: v };
  },
  async set(key, value) {
    this.cache[key] = value;
    if (!this.uid) return { key, value };
    try { await firestore.collection('users').doc(this.uid).set({ [key]: value }, { merge: true }); }
    catch (e) { console.error(e); }
    return { key, value };
  },
  reset() { this.cache = {}; this.uid = null; this.ready = false; }
};
window.storage = storage;

window.signInGoogle = async function() {
  const provider = new firebase.auth.GoogleAuthProvider();
  try { await auth.signInWithPopup(provider); }
  catch (e) { console.error(e); alert('ログイン失敗: ' + e.message); }
};
window.signOutNow = async function() { await auth.signOut(); };

  5: { name: '背中・二頭・体幹', ex: ['懸垂', 'ベントオーバーロウ', 'ダンベルカール', '腹筋ローラー'] },
  6: { name: '',         ex: [] },
};

const EPOCH = '1970-01-01';
const genId = () => `m${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`;
const sortHistory = (h) => [...h].sort((a, b) => a.effectiveFrom.localeCompare(b.effectiveFrom));
const arrEq = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);

function lookupHistory(history, dateStr, fallback, valueKey) {
  let result = fallback;
  for (const entry of history) {
    if (entry.effectiveFrom <= dateStr) result = entry[valueKey];
  }
  return result;
}

function App({ onSignOut }) {
  const [tab, setTab] = useState('meal');
  const [data, setData] = useState({});
  const [scheduleHistory, setScheduleHistory] = useState([{ effectiveFrom: EPOCH, schedule: DEFAULT_SCHEDULE }]);
  const [mealHistory, setMealHistory] = useState([{ effectiveFrom: EPOCH, presets: DEFAULT_MEAL_PRESETS }]);
  const [loading, setLoading] = useState(true);
  const [showSettings, setShowSettings] = useState(false);
  const [showMenuPicker, setShowMenuPicker] = useState(false);
  const [showWorkoutEdit, setShowWorkoutEdit] = useState(false);
  const [showMealEdit, setShowMealEdit] = useState(false);
  const [selectedKey, setSelectedKey] = useState(dateKey(new Date()));

  const todayDate = new Date();
  const today = dateKey(todayDate);

  useEffect(() => { setSelectedKey(today); }, [tab]);
  useEffect(() => { loadData(); }, []);

  async function loadData() {
    try { const r = await window.storage.get('habit-data'); setData(r ? r.value : {}); }
    catch { setData({}); }

    let mh = null;
    try { const r = await window.storage.get('habit-meal-history'); if (r) mh = r.value; } catch {}
    if (mh && Array.isArray(mh) && mh.length > 0) setMealHistory(sortHistory(mh));

    let sh = null;
    try { const r = await window.storage.get('habit-schedule-history'); if (r) sh = r.value; } catch {}
    if (sh && Array.isArray(sh) && sh.length > 0) setScheduleHistory(sortHistory(sh));

    setLoading(false);
  }

  async function saveData(newData) {
    setData(newData);
    try { await window.storage.set('habit-data', newData); } catch (e) { console.error(e); }
  }

  function appendToHistory(history, valueKey, newValue) {
    const todayStr = dateKey(new Date());
    const newHist = [...history];
    const lastIdx = newHist.length - 1;
    if (newHist[lastIdx]?.effectiveFrom === todayStr) {
      newHist[lastIdx] = { effectiveFrom: todayStr, [valueKey]: newValue };
    } else {
      newHist.push({ effectiveFrom: todayStr, [valueKey]: newValue });
    }
    return newHist;
  }

  async function saveMealPresets(newPresets) {
    const newHist = appendToHistory(mealHistory, 'presets', newPresets);
    setMealHistory(newHist);
    try { await window.storage.set('habit-meal-history', newHist); } catch (e) { console.error(e); }
  }

  async function saveSchedule(newSchedule) {
    const newHist = appendToHistory(scheduleHistory, 'schedule', newSchedule);
    setScheduleHistory(newHist);
    try { await window.storage.set('habit-schedule-history', newHist); } catch (e) { console.error(e); }
  }

  const getMealPresets = (dateStr) => lookupHistory(mealHistory, dateStr, DEFAULT_MEAL_PRESETS, 'presets');
  const getSchedule    = (dateStr) => lookupHistory(scheduleHistory, dateStr, DEFAULT_SCHEDULE, 'schedule');

  const currentSchedule = getSchedule(today);
  const currentMealPresets = getMealPresets(today);

  const selectedDate = parseKey(selectedKey);
  const selectedDow = selectedDate.getDay();
  const selectedSched = getSchedule(selectedKey);
  const selectedSlot = selectedSched[selectedDow];
  const selectedMealPresets = getMealPresets(selectedKey);

  const selectedMeal    = data[selectedKey]?.meal    || { checked: {}, status: null, memo: '' };
  const selectedWorkout = data[selectedKey]?.workout || { status: null, memo: '', exercises: {} };

  function getExerciseData(exerciseName, dateKeyStr) {
    const todayEx = data[dateKeyStr]?.workout?.exercises?.[exerciseName];
    if (todayEx) return { ...todayEx, isInherited: false };

    const sortedKeys = Object.keys(data).filter(k => k < dateKeyStr).sort().reverse();
    for (const k of sortedKeys) {
      const ex = data[k]?.workout?.exercises?.[exerciseName];
      if (ex && (ex.weight || ex.reps || ex.sets)) {
        return {
          checked: false,
          weight: ex.weight || '',
          reps: ex.reps || '',
          sets: ex.sets || '',
          isInherited: true,
        };
      }
    }
    return { checked: false, weight: '', reps: '', sets: '', isInherited: false };
  }

  function updateExercise(exerciseName, patch) {
    const cur = data[selectedKey] || {};
    const workout = cur.workout || { status: null, memo: '', exercises: {} };
    const exercises = workout.exercises || {};
    const exData = exercises[exerciseName] || { checked: false, weight: '', reps: '', sets: '' };
    saveData({
      ...data,
      [selectedKey]: {
        ...cur,
        workout: { ...workout, exercises: { ...exercises, [exerciseName]: { ...exData, ...patch } } }
      }
    });
  }

  function toggleExercise(exerciseName) {
    const exData = getExerciseData(exerciseName, selectedKey);
    updateExercise(exerciseName, {
      checked: !exData.checked,
      weight: exData.weight,
      reps: exData.reps,
      sets: exData.sets,
    });
  }

  function update(kind, patch) {
    const cur = data[selectedKey] || {};
    const existing = cur[kind] || (kind === 'meal'
      ? { checked: {}, status: null, memo: '' }
      : { status: null, memo: '', exercises: {} });
    saveData({ ...data, [selectedKey]: { ...cur, [kind]: { ...existing, ...patch } } });
  }

  function toggleMeal(id) {
    const cur = selectedMeal.checked || {};
    update('meal', { checked: { ...cur, [id]: !cur[id] } });
  }

  function setWorkoutMenu(menuChoice) {
    const cur = data[selectedKey] || {};
    const existing = cur.workout || { status: null, memo: '', exercises: {} };
    if (menuChoice === null) {
      const { menuChoice: _o, ...rest } = existing;
      saveData({ ...data, [selectedKey]: { ...cur, workout: { ...rest } } });
    } else {
      saveData({ ...data, [selectedKey]: { ...cur, workout: { ...existing, menuChoice } } });
    }
  }

  function setMealItems(items) {
    const cur = data[selectedKey] || {};
    const existing = cur.meal || { checked: {}, status: null, memo: '' };
    if (items === null) {
      const { itemsOverride: _o, ...rest } = existing;
      saveData({ ...data, [selectedKey]: { ...cur, meal: rest } });
    } else {
      saveData({ ...data, [selectedKey]: { ...cur, meal: { ...existing, itemsOverride: items } } });
    }
  }

  function buildCalendar(kind) {
    const cells = [];
    const td = new Date();
    const dow = td.getDay();
    const thisSunday = new Date(td);
    thisSunday.setDate(td.getDate() - dow);
    const start = new Date(thisSunday);
    start.setDate(thisSunday.getDate() - 14);
    const todayKey = dateKey(td);

    for (let i = 0; i < 21; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const key = dateKey(d);
      const status = data[key]?.[kind]?.status || null;
      const isFuture = key > todayKey;
      const isTodayCell = key === todayKey;
      const isSelectedCell = key === selectedKey;
      let isTarget = true;
      if (kind === 'meal') isTarget = isWeekday(d);
      if (kind === 'workout') {
        const sched = getSchedule(key);
        isTarget = sched[d.getDay()].ex.length > 0;
      }
      cells.push({ key, date: d.getDate(), status, isFuture, isTodayCell, isSelectedCell, isTarget });
    }
    return cells;
  }

  if (loading) {
    return (
      <div style={{ background: C.bg, height: '100dvh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.textSub, fontSize: 14, letterSpacing: '0.15em', fontWeight: 700 }}>
        LOADING…
      </div>
    );
  }

  const isViewingToday = selectedKey === today;
  const isFutureSelected = selectedKey > today;

  const mealItems = selectedMeal.itemsOverride || selectedMealPresets;
  const isMealCustomized = !!selectedMeal.itemsOverride;
  const workoutMenuChoice = selectedWorkout.menuChoice;
  const effectiveMenuName = workoutMenuChoice ? workoutMenuChoice.menuName     : selectedSlot.name;
  const effectiveExNames  = workoutMenuChoice ? workoutMenuChoice.exerciseNames : selectedSlot.ex;
  const isWorkoutCustomized = !!workoutMenuChoice;

  const calendar = buildCalendar(tab);
  const isMealTargetSelected = isWeekday(selectedDate);

  const availableMenus = (() => {
    const map = new Map();
    Object.values(currentSchedule).forEach(s => {
      if (s.ex.length > 0 && !map.has(s.name)) {
        map.set(s.name, { menuName: s.name, exerciseNames: [...s.ex] });
      }
    });
    return Array.from(map.values());
  })();

  const current = tab === 'meal' ? selectedMeal : selectedWorkout;

  return (
    <div style={{
      background: C.bg, color: C.text,
      height: '100dvh',
      paddingTop: 'env(safe-area-inset-top)',
      paddingBottom: 'env(safe-area-inset-bottom)',
      display: 'flex', flexDirection: 'column',
      maxWidth: 393, margin: '0 auto',
      position: 'relative', overflow: 'hidden',
      fontVariantNumeric: 'tabular-nums',
    }}>
      <button onClick={() => setShowSettings(true)} style={{
        position: 'absolute', top: 'calc(env(safe-area-inset-top) + 18px)', right: 16,
        background: 'transparent', border: 'none',
        fontSize: 24, color: C.textSub, padding: 6, lineHeight: 1,
        zIndex: 5,
      }}>⚙</button>

      {/* カレンダー（3週間）*/}
      <div style={{ padding: '52px 20px 14px', flexShrink: 0 }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4, marginBottom: 8 }}>
          {['日','月','火','水','木','金','土'].map((l, i) => (
            <div key={i} style={{
              fontSize: 12, textAlign: 'center',
              color: (i === 0 || i === 6) ? C.textDim : C.textSub,
              fontWeight: 800, letterSpacing: '0.05em',
            }}>{l}</div>
          ))}
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4 }}>
          {calendar.map((c, i) => {
            const bg = c.status === 'success' ? C.success
                     : c.status === 'fail'    ? C.fail
                     : c.isSelectedCell       ? C.surfaceAlt
                     : 'transparent';
            const fg = c.status === 'success' ? '#0a0a0a'
                     : c.status === 'fail'    ? '#0a0a0a'
                     : c.isTodayCell          ? C.success
                     : c.isFuture             ? C.textFaint
                     : !c.isTarget            ? C.textDim
                     : C.text;
            const border = c.isSelectedCell ? `2px solid ${C.today}`
                         : c.isTodayCell    ? `2px solid ${C.success}`
                         : `1px solid ${C.border}`;
            const fontWeight = c.status ? 900 : (c.isTodayCell ? 900 : 700);
            const fontSize = c.isTodayCell ? 16 : 14;
            return (
              <button key={i} onClick={() => setSelectedKey(c.key)}
                style={{
                  aspectRatio: '1',
                  background: bg, border,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize, color: fg, fontWeight,
                  padding: 0,
                }}>{c.date}</button>
            );
          })}
        </div>
      </div>

      <div style={{ display: 'flex', gap: 6, padding: '6px 20px', flexShrink: 0 }}>
        {[['meal', '食事'], ['workout', 'トレーニング']].map(([k, label]) => {
          const active = tab === k;
          return (
            <button key={k} onClick={() => setTab(k)} style={{
              flex: 1, padding: '12px',
              background: active ? C.text : 'transparent',
              color: active ? C.bg : C.textSub,
              border: `1px solid ${active ? C.text : C.border}`,
              fontSize: 14, fontWeight: 800, letterSpacing: '0.08em',
            }}>{label}</button>
          );
        })}
      </div>

      {!isViewingToday && (
        <div style={{
          padding: '8px 20px',
          background: isFutureSelected ? '#1c2410' : '#241015',
          borderTop: `1px solid ${C.border}`,
          borderBottom: `1px solid ${C.border}`,
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          flexShrink: 0,
        }}>
          <span style={{ fontSize: 14, color: C.text, fontWeight: 800 }}>
            {formatDateShort(selectedDate)} {isFutureSelected && <span style={{ color: C.success, marginLeft: 4 }}>· 予定</span>}
          </span>
          <button onClick={() => setSelectedKey(today)} style={{
            background: 'transparent', border: `1px solid ${C.borderStrong}`,
            color: C.text,
            fontSize: 12, padding: '5px 12px', fontWeight: 800,
            letterSpacing: '0.06em',
          }}>今日</button>
        </div>
      )}

      <div style={{
        flex: 1, padding: '10px 20px 14px',
        display: 'flex', flexDirection: 'column', gap: 8,
        overflow: 'auto',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', minWidth: 0 }}>
            <span style={{ ...FONT_LABEL, fontSize: 13, color: C.text }}>
              {tab === 'workout' ? (effectiveMenuName || '休息日') : '本日の食事'}
            </span>
            {(isWorkoutCustomized && tab === 'workout') || (isMealCustomized && tab === 'meal') ? (
              <span style={{
                fontSize: 10, letterSpacing: '0.1em', fontWeight: 800,
                color: C.fail, border: `1px solid ${C.fail}`,
                padding: '2px 6px',
              }}>OVERRIDE</span>
            ) : null}
          </div>
          <div style={{ display: 'flex', gap: 6 }}>
            {tab === 'workout' && (
              <button onClick={() => setShowMenuPicker(true)} style={{
                background: 'transparent', border: `1px solid ${C.borderStrong}`,
                color: C.text,
                fontSize: 13, padding: '6px 12px', fontWeight: 800,
                letterSpacing: '0.04em',
              }}>切替</button>
            )}
            <button onClick={() => tab === 'workout' ? setShowWorkoutEdit(true) : setShowMealEdit(true)} style={{
              background: 'transparent', border: `1px solid ${C.borderStrong}`,
              color: C.text,
              fontSize: 13, padding: '6px 12px', fontWeight: 800,
              letterSpacing: '0.04em',
            }}>編集</button>
          </div>
        </div>

        {tab === 'meal' && !isMealTargetSelected && (
          <div style={{ fontSize: 12, color: C.textDim, fontWeight: 500 }}>※ 土日は対象外</div>
        )}

        {tab === 'meal' && mealItems.length > 0 && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            {mealItems.map(it => {
              const on = selectedMeal.checked?.[it.id];
              return (
                <button key={it.id} onClick={() => toggleMeal(it.id)} style={{
                  display: 'flex', alignItems: 'center', gap: 14,
                  padding: '18px 6px',
                  background: on ? 'rgba(163, 255, 61, 0.06)' : 'transparent',
                  border: 'none',
                  borderBottom: `1px solid ${C.border}`,
                  textAlign: 'left',
                }}>
                  <span style={{
                    width: 24, height: 24,
                    border: `2px solid ${on ? C.success : C.borderStrong}`,
                    background: on ? C.success : 'transparent',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    color: '#0a0a0a', fontSize: 15, fontWeight: 900, flexShrink: 0,
                  }}>{on ? '✓' : ''}</span>
                  <span style={{
                    flex: 1, fontSize: 16, fontWeight: 700,
                    color: on ? C.textSub : C.text,
                    textDecoration: on ? 'line-through' : 'none',
                  }}>{it.label}</span>
                  {it.time && (
                    <span style={{ fontSize: 12, color: C.textDim, fontWeight: 800 }}>
                      {it.time}
                    </span>
                  )}
                </button>
              );
            })}
          </div>
        )}

        {tab === 'workout' && effectiveExNames.length > 0 && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            {effectiveExNames.map((exName, idx) => {
              const ex = getExerciseData(exName, selectedKey);
              const on = ex.checked;
              const valueColor = ex.isInherited ? C.textDim : C.text;
              return (
                <div key={`${exName}-${idx}`} style={{
                  padding: '7px 4px 9px',
                  background: on ? 'rgba(163, 255, 61, 0.06)' : 'transparent',
                  borderBottom: `1px solid ${C.border}`,
                }}>
                  <button onClick={() => toggleExercise(exName)} style={{
                    display: 'flex', alignItems: 'center', gap: 12, width: '100%',
                    background: 'transparent', border: 'none', padding: 0,
                    textAlign: 'left',
                  }}>
                    <span style={{
                      width: 22, height: 22,
                      border: `2px solid ${on ? C.success : C.borderStrong}`,
                      background: on ? C.success : 'transparent',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      color: '#0a0a0a', fontSize: 14, fontWeight: 900, flexShrink: 0,
                    }}>{on ? '✓' : ''}</span>
                    <span style={{
                      fontSize: 15, fontWeight: 700,
                      color: on ? C.textSub : C.text,
                      textDecoration: on ? 'line-through' : 'none',
                      lineHeight: 1.3,
                    }}>{exName}</span>
                  </button>

                  <div style={{
                    display: 'flex', alignItems: 'center', gap: 4,
                    marginTop: 8, paddingLeft: 34,
                  }}>
                    <input type="text" inputMode="decimal"
                      value={ex.weight || ''}
                      onChange={(e) => updateExercise(exName, { weight: e.target.value })}
                      placeholder="0"
                      style={{
                        width: 52, padding: '7px 4px',
                        background: C.surfaceAlt,
                        border: `1px solid ${ex.isInherited ? C.border : C.borderStrong}`,
                        fontSize: 16, fontWeight: 800,
                        color: valueColor,
                        textAlign: 'center',
                      }} />
                    <span style={{ fontSize: 13, color: C.textSub, fontWeight: 800, marginRight: 4 }}>kg</span>
                    <span style={{ fontSize: 14, color: C.textDim, fontWeight: 800, margin: '0 2px' }}>×</span>
                    <input type="text" inputMode="numeric"
                      value={ex.reps || ''}
                      onChange={(e) => updateExercise(exName, { reps: e.target.value })}
                      placeholder="0"
                      style={{
                        width: 44, padding: '7px 4px',
                        background: C.surfaceAlt,
                        border: `1px solid ${ex.isInherited ? C.border : C.borderStrong}`,
                        fontSize: 16, fontWeight: 800,
                        color: valueColor,
                        textAlign: 'center',
                      }} />
                    <span style={{ fontSize: 13, color: C.textSub, fontWeight: 800, marginRight: 4 }}>回</span>
                    <span style={{ fontSize: 14, color: C.textDim, fontWeight: 800, margin: '0 2px' }}>×</span>
                    <input type="text" inputMode="numeric"
                      value={ex.sets || ''}
                      onChange={(e) => updateExercise(exName, { sets: e.target.value })}
                      placeholder="0"
                      style={{
                        width: 38, padding: '7px 4px',
                        background: C.surfaceAlt,
                        border: `1px solid ${ex.isInherited ? C.border : C.borderStrong}`,
                        fontSize: 16, fontWeight: 800,
                        color: valueColor,
                        textAlign: 'center',
                      }} />
                    <span style={{ fontSize: 13, color: C.textSub, fontWeight: 800 }}>セット</span>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {((tab === 'meal' && mealItems.length === 0) || (tab === 'workout' && effectiveExNames.length === 0)) && (
          <div style={{ padding: '20px 0', color: C.textDim, fontSize: 13, textAlign: 'center', fontWeight: 600 }}>
            {tab === 'workout' ? '休息日 — 「切替」「編集」で記録可' : '項目なし — 「編集」で追加'}
          </div>
        )}

        {((tab === 'meal' && mealItems.length > 0) || (tab === 'workout' && effectiveExNames.length > 0)) && (
          <>
            <div style={{ display: 'flex', gap: 6, marginTop: 4 }}>
              <button onClick={() => update(tab, { status: current.status === 'success' ? null : 'success' })} style={{
                flex: 1, padding: '12px',
                background: current.status === 'success' ? C.success : 'transparent',
                color: current.status === 'success' ? '#0a0a0a' : C.success,
                border: `2px solid ${C.success}`,
                fontSize: 14, fontWeight: 900, letterSpacing: '0.08em',
              }}>守れた</button>
              <button onClick={() => update(tab, { status: current.status === 'fail' ? null : 'fail' })} style={{
                flex: 1, padding: '12px',
                background: current.status === 'fail' ? C.fail : 'transparent',
                color: current.status === 'fail' ? '#0a0a0a' : C.fail,
                border: `2px solid ${C.fail}`,
                fontSize: 14, fontWeight: 900, letterSpacing: '0.08em',
              }}>守れなかった</button>
            </div>

            <input type="text" placeholder={current.status === 'fail' ? '何があった？' : 'メモ'}
              value={current.memo || ''}
              onChange={(e) => update(tab, { memo: e.target.value })}
              style={{
                padding: '12px 14px', background: C.surface,
                border: `1px solid ${C.border}`,
                fontSize: 14, color: C.text, fontWeight: 600,
              }}
            />
          </>
        )}
      </div>

      {showSettings && (
        <SettingsModal
          schedule={currentSchedule} mealPresets={currentMealPresets}
          onSaveSchedule={saveSchedule} onSaveMealPresets={saveMealPresets}
          onClose={() => setShowSettings(false)}
          onSignOut={onSignOut}
        />
      )}
      {showMenuPicker && (
        <MenuPickerModal
          currentChoice={workoutMenuChoice}
          scheduledMenuName={selectedSlot.name}
          scheduledExNames={selectedSlot.ex}
          availableMenus={availableMenus}
          onPick={(c) => { setWorkoutMenu(c); setShowMenuPicker(false); }}
          onClose={() => setShowMenuPicker(false)}
        />
      )}
      {showWorkoutEdit && (
        <WorkoutDayEditModal
          dateLabel={formatDateShort(selectedDate)}
          initialName={effectiveMenuName || ''}
          initialExercises={effectiveExNames}
          isCustomized={isWorkoutCustomized}
          onSave={(menuName, exerciseNames) => { setWorkoutMenu({ menuName, exerciseNames }); setShowWorkoutEdit(false); }}
          onReset={() => { setWorkoutMenu(null); setShowWorkoutEdit(false); }}
          onClose={() => setShowWorkoutEdit(false)}
        />
      )}
      {showMealEdit && (
        <MealDayEditModal
          dateLabel={formatDateShort(selectedDate)}
          initialItems={mealItems}
          isCustomized={isMealCustomized}
          onSave={(items) => { setMealItems(items); setShowMealEdit(false); }}
          onReset={() => { setMealItems(null); setShowMealEdit(false); }}
          onClose={() => setShowMealEdit(false)}
        />
      )}
    </div>
  );
}

function ModalShell({ title, onClose, children, maxWidth = 360 }) {
  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: 'rgba(0,0,0,0.75)',
      backdropFilter: 'blur(6px)',
      WebkitBackdropFilter: 'blur(6px)',
      display: 'flex', alignItems: 'flex-start', justifyContent: 'center',
      padding: '24px 14px',
      paddingTop: 'max(24px, calc(env(safe-area-inset-top) + 16px))',
      paddingBottom: 'max(24px, env(safe-area-inset-bottom))',
      zIndex: 10, overflow: 'auto',
    }}>
      <div style={{
        background: C.surface, width: '100%', maxWidth,
        padding: '18px 20px 16px',
        border: `1px solid ${C.border}`,
        color: C.text,
      }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
          <div style={{ ...FONT_LABEL, fontSize: 13, color: C.text }}>{title}</div>
          <button onClick={onClose} style={{
            background: 'transparent', border: 'none',
            fontSize: 24, color: C.textSub, lineHeight: 1, padding: 0,
          }}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function MenuPickerModal({ currentChoice, scheduledMenuName, scheduledExNames, availableMenus, onPick, onClose }) {
  const isScheduledRest = scheduledExNames.length === 0;
  return (
    <ModalShell title="メニュー切替" onClose={onClose}>
      <div style={{ fontSize: 12, color: C.textDim, marginBottom: 14, fontWeight: 500 }}>この日に当てるメニューを変更</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        <button onClick={() => onPick(null)} style={{
          padding: '14px 16px', textAlign: 'left',
          background: 'transparent', border: `1px solid ${C.border}`, color: C.text,
          fontSize: 14, fontWeight: 700,
        }}>
          ↩ スケジュール通り
          <span style={{ fontSize: 12, color: C.textSub, marginLeft: 8, fontWeight: 500 }}>
            （{isScheduledRest ? '休息日' : scheduledMenuName}）
          </span>
        </button>
        <button onClick={() => onPick({ menuName: '', exerciseNames: [] })} style={{
          padding: '14px 16px', textAlign: 'left',
          background: currentChoice && currentChoice.exerciseNames.length === 0 ? C.text : 'transparent',
          color:      currentChoice && currentChoice.exerciseNames.length === 0 ? C.bg : C.text,
          border: `1px solid ${C.border}`,
          fontSize: 14, fontWeight: 700,
        }}>休息にする</button>
        {availableMenus.map((m, i) => {
          const selected = currentChoice && currentChoice.menuName === m.menuName && arrEq(currentChoice.exerciseNames, m.exerciseNames);
          return (
            <button key={i} onClick={() => onPick(m)} style={{
              padding: '14px 16px', textAlign: 'left',
              background: selected ? C.success : 'transparent',
              color:      selected ? C.bg : C.text,
              border: `1px solid ${selected ? C.success : C.border}`,
              fontSize: 14, fontWeight: 800,
            }}>
              {m.menuName}
              <div style={{ fontSize: 12, color: selected ? C.bg : C.textSub, marginTop: 3, fontWeight: 500 }}>
                {m.exerciseNames.join(' / ')}
              </div>
            </button>
          );
        })}
      </div>
    </ModalShell>
  );
}

function WorkoutDayEditModal({ dateLabel, initialName, initialExercises, isCustomized, onSave, onReset, onClose }) {
  const [name, setName] = useState(initialName);
  const [exText, setExText] = useState(initialExercises.join('\n'));
  function handleSave() {
    const exerciseNames = exText.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    onSave(name.trim(), exerciseNames);
  }
  return (
    <ModalShell title={`${dateLabel} 編集`} onClose={onClose}>
      <div style={{ fontSize: 12, color: C.textDim, marginBottom: 14, fontWeight: 500 }}>※ この日だけの設定</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 16 }}>
        <div style={{ ...FONT_LABEL, fontSize: 11 }}>メニュー名</div>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="例: 胸・三頭"
          style={{ padding: '11px 13px', background: C.surfaceAlt, border: `1px solid ${C.border}`, fontSize: 15, color: C.text, fontWeight: 600 }} />
        <div style={{ ...FONT_LABEL, fontSize: 11, marginTop: 4 }}>種目（1行1種目）</div>
        <textarea value={exText} onChange={(e) => setExText(e.target.value)} placeholder={"ベンチプレス\nダンベルフライ\nディップス"} rows={5}
          style={{ padding: '11px 13px', background: C.surfaceAlt, border: `1px solid ${C.border}`, resize: 'vertical', fontSize: 15, color: C.text, fontWeight: 500 }} />
      </div>
      <ModalActions isCustomized={isCustomized} onReset={onReset} onClose={onClose} onSave={handleSave} />
    </ModalShell>
  );
}

function MealDayEditModal({ dateLabel, initialItems, isCustomized, onSave, onReset, onClose }) {
  const [items, setItems] = useState(() => initialItems.map(it => ({ ...it })));
  function updateItem(i, field, value) {
    setItems(arr => arr.map((it, idx) => idx === i ? { ...it, [field]: value } : it));
  }
  function removeItem(i) { setItems(arr => arr.filter((_, idx) => idx !== i)); }
  function addItem() { setItems(arr => [...arr, { id: genId(), label: '', time: '' }]); }
  function handleSave() {
    const cleaned = items
      .map(m => ({ id: m.id, label: (m.label || '').trim(), time: (m.time || '').trim() }))
      .filter(m => m.label.length > 0);
    onSave(cleaned);
  }
  return (
    <ModalShell title={`${dateLabel} 食事編集`} onClose={onClose}>
      <div style={{ fontSize: 12, color: C.textDim, marginBottom: 14, fontWeight: 500 }}>※ この日だけの設定</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 7, marginBottom: 16 }}>
        {items.map((it, i) => (
          <div key={it.id} style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
            <input value={it.label} onChange={(e) => updateItem(i, 'label', e.target.value)} placeholder="項目名"
              style={{ flex: 1, padding: '10px 12px', background: C.surfaceAlt, border: `1px solid ${C.border}`, fontSize: 14, color: C.text, fontWeight: 600, minWidth: 0 }} />
            <input value={it.time} onChange={(e) => updateItem(i, 'time', e.target.value)} placeholder="10:00"
              style={{ width: 68, padding: '10px 12px', background: C.surfaceAlt, border: `1px solid ${C.border}`, fontSize: 13, color: C.text, fontWeight: 700 }} />
            <button onClick={() => removeItem(i)} style={{
              width: 34, height: 34, padding: 0,
              background: 'transparent', border: `1px solid ${C.border}`, color: C.fail,
              fontSize: 16, fontWeight: 700, lineHeight: 1,
            }}>×</button>
          </div>
        ))}
        <button onClick={addItem} style={{
          padding: 10, background: 'transparent',
          border: `1px dashed ${C.borderStrong}`, color: C.textSub,
          fontSize: 13, fontWeight: 600,
        }}>＋ 項目を追加</button>
      </div>
      <ModalActions isCustomized={isCustomized} onReset={onReset} onClose={onClose} onSave={handleSave} />
    </ModalShell>
  );
}

function ModalActions({ isCustomized, onReset, onClose, onSave }) {
  return (
    <div style={{ display: 'flex', gap: 6 }}>
      {isCustomized && (
        <button onClick={onReset} style={{
          flex: 1, padding: 13, background: 'transparent',
          border: `1px solid ${C.fail}`, color: C.fail,
          fontSize: 13, fontWeight: 800, letterSpacing: '0.04em',
        }}>リセット</button>
      )}
      <button onClick={onClose} style={{
        flex: 1, padding: 13, background: 'transparent',
        border: `1px solid ${C.borderStrong}`, color: C.textSub,
        fontSize: 13, fontWeight: 800, letterSpacing: '0.04em',
      }}>キャンセル</button>
      <button onClick={onSave} style={{
        flex: 1, padding: 13, background: C.text,
        border: `1px solid ${C.text}`, color: C.bg,
        fontSize: 13, fontWeight: 900, letterSpacing: '0.04em',
      }}>保存</button>
    </div>
  );
}

function SettingsModal({ schedule, mealPresets, onSaveSchedule, onSaveMealPresets, onClose, onSignOut }) {
  const [section, setSection] = useState('meal');
  const [draftMeal, setDraftMeal] = useState(() => mealPresets.map(p => ({ ...p })));
  const [draftSchedule, setDraftSchedule] = useState(() => {
    const obj = {};
    [0,1,2,3,4,5,6].forEach(dow => {
      obj[dow] = {
        name: schedule[dow]?.name || '',
        exText: (schedule[dow]?.ex || []).join('\n'),
        isTraining: (schedule[dow]?.ex || []).length > 0,
      };
    });
    return obj;
  });

  function updateMealItem(i, field, value) {
    setDraftMeal(arr => arr.map((it, idx) => idx === i ? { ...it, [field]: value } : it));
  }
  function removeMealItem(i) { setDraftMeal(arr => arr.filter((_, idx) => idx !== i)); }
  function addMealItem() { setDraftMeal(arr => [...arr, { id: genId(), label: '', time: '' }]); }
  function updateDay(dow, field, value) { setDraftSchedule(d => ({ ...d, [dow]: { ...d[dow], [field]: value } })); }
  function toggleRest(dow) {
    setDraftSchedule(d => {
      const cur = d[dow];
      if (cur.isTraining) return { ...d, [dow]: { name: '', exText: '', isTraining: false } };
      return { ...d, [dow]: { name: 'トレーニング', exText: '種目1', isTraining: true } };
    });
  }
  function handleSave() {
    const meals = draftMeal.map(m => ({ id: m.id, label: m.label.trim(), time: m.time.trim() })).filter(m => m.label.length > 0);
    onSaveMealPresets(meals);
    const sched = {};
    [0,1,2,3,4,5,6].forEach(dow => {
      const slot = draftSchedule[dow];
      if (slot.isTraining) {
        const ex = slot.exText.split('\n').map(s => s.trim()).filter(s => s.length > 0);
        sched[dow] = { name: slot.name, ex };
      } else {
        sched[dow] = { name: '', ex: [] };
      }
    });
    onSaveSchedule(sched);
    onClose();
  }

  return (
    <ModalShell title="全体設定" onClose={onClose} maxWidth={380}>
      <div style={{ fontSize: 11, color: C.textDim, marginBottom: 14, lineHeight: 1.6, fontWeight: 500 }}>
        ※ 変更は今日以降に適用。過去や個別編集された日には影響しません。
      </div>
      <div style={{ display: 'flex', gap: 6, marginBottom: 16 }}>
        {[['meal', '食事'], ['workout', 'トレーニング']].map(([k, label]) => {
          const active = section === k;
          return (
            <button key={k} onClick={() => setSection(k)} style={{
              flex: 1, padding: 10,
              background: active ? C.text : 'transparent',
              color: active ? C.bg : C.textSub,
              border: `1px solid ${active ? C.text : C.border}`,
              fontSize: 13, fontWeight: 800, letterSpacing: '0.04em',
            }}>{label}</button>
          );
        })}
      </div>

      {section === 'meal' && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ ...FONT_LABEL, fontSize: 11, marginBottom: 10 }}>毎日の食事メニュー</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
            {draftMeal.map((it, i) => (
              <div key={it.id} style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                <input value={it.label} onChange={(e) => updateMealItem(i, 'label', e.target.value)} placeholder="項目名"
                  style={{ flex: 1, padding: '10px 12px', background: C.surfaceAlt, border: `1px solid ${C.border}`, fontSize: 14, color: C.text, fontWeight: 600, minWidth: 0 }} />
                <input value={it.time} onChange={(e) => updateMealItem(i, 'time', e.target.value)} placeholder="10:00"
                  style={{ width: 68, padding: '10px 12px', background: C.surfaceAlt, border: `1px solid ${C.border}`, fontSize: 13, color: C.text, fontWeight: 700 }} />
                <button onClick={() => removeMealItem(i)} style={{
                  width: 34, height: 34, padding: 0,
                  background: 'transparent', border: `1px solid ${C.border}`, color: C.fail,
                  fontSize: 16, fontWeight: 700, lineHeight: 1,
                }}>×</button>
              </div>
            ))}
            <button onClick={addMealItem} style={{
              padding: 10, background: 'transparent',
              border: `1px dashed ${C.borderStrong}`, color: C.textSub,
              fontSize: 13, fontWeight: 600,
            }}>＋ 項目を追加</button>
          </div>
        </div>
      )}

      {section === 'workout' && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginBottom: 16 }}>
          {[1, 2, 3, 4, 5, 6, 0].map(dow => {
            const slot = draftSchedule[dow];
            const isRest = !slot.isTraining;
            return (
              <div key={dow} style={{ borderBottom: `1px solid ${C.border}`, paddingBottom: 10 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 7 }}>
                  <div style={{ fontSize: 17, fontWeight: 800, width: 24 }}>{DAY_LABELS_JP[dow]}</div>
                  <button onClick={() => toggleRest(dow)} style={{
                    padding: '5px 12px', fontSize: 12, fontWeight: 700,
                    background: isRest ? 'transparent' : C.success,
                    color: isRest ? C.textSub : C.bg,
                    border: `1px solid ${isRest ? C.border : C.success}`,
                    letterSpacing: '0.04em',
                  }}>{isRest ? '休息日' : 'トレーニング日'}</button>
                </div>
                {!isRest && (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6, paddingLeft: 36 }}>
                    <input value={slot.name} onChange={(e) => updateDay(dow, 'name', e.target.value)} placeholder="メニュー名"
                      style={{ padding: '8px 11px', background: C.surfaceAlt, border: `1px solid ${C.border}`, fontSize: 13, color: C.text, fontWeight: 600 }} />
                    <textarea value={slot.exText} onChange={(e) => updateDay(dow, 'exText', e.target.value)} placeholder="種目（1行に1種目）" rows={3}
                      style={{ padding: '8px 11px', background: C.surfaceAlt, border: `1px solid ${C.border}`, resize: 'vertical', fontSize: 13, color: C.text, fontWeight: 500 }} />
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      <div style={{ display: 'flex', gap: 6, marginBottom: 10 }}>
        <button onClick={onClose} style={{
          flex: 1, padding: 13, background: 'transparent',
          border: `1px solid ${C.borderStrong}`, color: C.textSub,
          fontSize: 13, fontWeight: 800, letterSpacing: '0.04em',
        }}>キャンセル</button>
        <button onClick={handleSave} style={{
          flex: 1, padding: 13, background: C.text,
          border: `1px solid ${C.text}`, color: C.bg,
          fontSize: 13, fontWeight: 900, letterSpacing: '0.04em',
        }}>保存</button>
      </div>

      <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 10, marginTop: 6 }}>
        <button onClick={onSignOut} style={{
          width: '100%', padding: 9, background: 'transparent',
          border: `1px solid ${C.fail}`, color: C.fail,
          fontSize: 11, fontWeight: 700, letterSpacing: '0.1em',
        }}>ログアウト</button>
      </div>
    </ModalShell>
  );
}

function Root() {
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [dataReady, setDataReady] = useState(false);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async u => {
      if (u) {
        window.storage.uid = u.uid;
        await window.storage.loadAll();
        setUser(u);
        setDataReady(true);
      } else {
        window.storage.reset();
        setUser(null);
        setDataReady(false);
      }
      setAuthReady(true);
    });
    return () => unsub();
  }, []);

  if (!authReady) return <Splash text="認証中" />;
  if (!user) return <LoginScreen onLogin={() => window.signInGoogle()} />;
  if (!dataReady) return <Splash text="読み込み中" />;

  return <App onSignOut={() => window.signOutNow()} />;
}

function Splash({ text }) {
  return (
    <div style={{
      background: C.bg, height: '100dvh',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      color: C.textSub, fontSize: 14, letterSpacing: '0.15em', fontWeight: 700,
    }}>{text}…</div>
  );
}

function LoginScreen({ onLogin }) {
  return (
    <div style={{
      background: C.bg, height: '100dvh',
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      padding: '40px 24px', gap: 12,
      color: C.text, maxWidth: 393, margin: '0 auto',
    }}>
      <div style={{ fontSize: 48, fontWeight: 900, letterSpacing: '-0.04em', marginBottom: 4 }}>HABIT</div>
      <div style={{ ...FONT_LABEL, fontSize: 11, color: C.success, marginBottom: 32 }}>TRACKER</div>
      <div style={{ fontSize: 13, color: C.textSub, textAlign: 'center', lineHeight: 1.7, marginBottom: 28 }}>
        食事とトレーニングの<br/>毎日を記録する
      </div>
      <button onClick={onLogin} style={{
        background: C.success, color: C.bg,
        padding: '14px 36px', border: 'none',
        fontSize: 14, fontWeight: 800, letterSpacing: '0.12em',
      }}>Googleでログイン</button>
      <div style={{ fontSize: 10, color: C.textDim, marginTop: 24, textAlign: 'center', lineHeight: 1.6 }}>
        データはGoogleアカウントに<br/>紐づいて保存されます
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
